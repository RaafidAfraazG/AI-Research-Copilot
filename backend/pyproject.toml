[tool.poetry]
name = "ai-research-copilot-backend"
version = "0.1.0"
description = "AI Research Copilot — FastAPI Backend"
authors = []
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"

# ── Web Framework ──────────────────────────────────────────────────────────
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# ── Database ───────────────────────────────────────────────────────────────
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"

# ── Search Backends (clients only — no indexing logic yet) ──────────────────
opensearch-py = {extras = ["async"], version = "^2.6.0"}
qdrant-client = "^1.9.0"

# ── Cache ──────────────────────────────────────────────────────────────────
redis = {extras = ["hiredis"], version = "^5.0.0"}

# ── HTTP Client ────────────────────────────────────────────────────────────
httpx = "^0.27.0"

# ── Logging ────────────────────────────────────────────────────────────────
structlog = "^24.2.0"

# ── Utilities ──────────────────────────────────────────────────────────────
python-dotenv = "^1.0.0"
tenacity = "^8.3.0"

# ── Phase 2+ deps (NOT installed yet — listed for documentation) ────────────
# sentence-transformers = "^3.0.0"   # Phase 2: embeddings
# torch = "^2.3.0"                   # Phase 2: required by sentence-transformers
# transformers = "^4.41.0"           # Phase 2: required by cross-encoder reranker
# instructor = "^1.3.0"              # Phase 5: structured LLM output
# trafilatura = "^1.9.0"             # Phase 3: web content extraction
# tiktoken = "^0.7.0"                # Phase 5: token counting
# celery = {extras = ["redis"], version = "^5.4.0"}  # Phase 6: async tasks

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
aiosqlite = "^0.20.0"    # SQLite driver for in-memory model tests
ruff = "^0.4.0"
mypy = "^1.10.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "db", "services", "retrieval", "ranking", "synthesis", "connectors", "embedding", "llm"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
